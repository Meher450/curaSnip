		plugins {
			id 'java'
			id 'org.springframework.boot' version '4.0.6'
			id 'io.spring.dependency-management' version '1.1.7'
		}

		group = 'com'
		version = '0.0.1-SNAPSHOT'

		java {
			toolchain {
				languageVersion = JavaLanguageVersion.of(21)
			}
		}

		repositories {
			mavenCentral()
		}

		dependencies {
			implementation 'org.springframework.boot:spring-boot-starter-web'
			implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
			implementation 'org.springframework.boot:spring-boot-starter-validation'

			implementation platform("software.amazon.awssdk:bom:2.33.4")
			implementation "software.amazon.awssdk:s3"

			implementation "org.springframework.boot:spring-boot-starter-data-redis"

			implementation 'org.springframework.boot:spring-boot-starter-flyway'

			implementation 'org.flywaydb:flyway-database-postgresql'
			runtimeOnly 'org.postgresql:postgresql'

//			implementation 'org.springframework.boot:spring-boot-starter-amqp'

			implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'

			implementation 'org.springframework.boot:spring-boot-starter-aspectj'
			implementation 'org.springframework.boot:spring-boot-starter-actuator'


			implementation 'org.springframework.security:spring-security-crypto'

			implementation 'com.bucket4j:bucket4j_jdk17-redis-common:8.17.0'
			implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.17.0'

			implementation 'net.javacrumbs.shedlock:shedlock-spring:7.8.0'
			implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.8.0'

			runtimeOnly 'io.micrometer:micrometer-registry-prometheus'



			compileOnly 'org.projectlombok:lombok'
			annotationProcessor 'org.projectlombok:lombok'



			testImplementation 'org.springframework.boot:spring-boot-starter-test'
		}

		tasks.named('test') {
			useJUnitPlatform()
		}

		tasks.withType(Test).configureEach {
			systemProperty 'user.timezone', 'Asia/Kolkata'
		}
